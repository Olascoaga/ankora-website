<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="title desc">
  <title id="title">Library preparation workflow</title>
  <desc id="desc">Schematic, not a screenshot or calculated result. Imported SDF, MOL or SMILES pass through descriptor filters and explicit selection, then independent conformer generation, minimization and PDBQT preparation.</desc>
  <rect width="640" height="620" rx="6" fill="#0b0c0e"/>
  <g fill="none" stroke="#3e352a" stroke-width="1.5"><path d="M320 119v38m0 129v39m0 99v38"/><path d="m315 149 5 7 5-7m-10 168 5 7 5-7m-10 129 5 7 5-7" stroke="#dfa45a"/></g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="49" y="38" width="542" height="81" rx="5" fill="#16191f" stroke="#34373e"/>
    <text x="320" y="72" fill="#8c887f" font-family="Consolas, monospace" font-size="12" letter-spacing="2">01 / INPUT</text>
    <text x="320" y="101" fill="#eceae4" font-size="22">SDF · MOL · SMILES</text>
    <rect x="49" y="161" width="542" height="125" rx="5" fill="#16191f" stroke="#6b5436"/>
    <text x="320" y="192" fill="#dfa45a" font-family="Consolas, monospace" font-size="12" letter-spacing="2">02 / FILTER</text>
    <text x="320" y="226" fill="#eceae4" font-size="19">Lipinski · Veber · Ghose · Muegge</text>
    <text x="320" y="256" fill="#b5b2aa" font-size="16">QED / PAINS / Brenk / duplicates</text>
    <rect x="49" y="330" width="542" height="94" rx="5" fill="#211b14" stroke="#8d6a3e"/>
    <text x="320" y="362" fill="#dfa45a" font-family="Consolas, monospace" font-size="12" letter-spacing="2">03 / SELECT</text>
    <text x="320" y="396" fill="#eceae4" font-size="20">Selection manifest</text>
    <rect x="49" y="468" width="542" height="99" rx="5" fill="#16191f" stroke="#34373e"/>
    <text x="320" y="501" fill="#789bb0" font-family="Consolas, monospace" font-size="12" letter-spacing="2">04 / PREPARE</text>
    <text x="320" y="537" fill="#eceae4" font-size="20">ETKDGv3 → MMFF → Meeko / PDBQT</text>
    <text x="320" y="601" fill="#8c887f" font-family="Consolas, monospace" font-size="11">WORKFLOW SCHEMATIC / NOT A CALCULATED RESULT</text>
  </g>
</svg>
